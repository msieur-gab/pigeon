<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Pigeon · prototype · add a contact</title>
    <meta name="theme-color" content="#ffffff">
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/vendor/nacl-fast.min.js"></script>
    <style>
        /* ---- Prototype only: home with a FAB, and a bottom sheet ---- */

        body { padding-bottom: 6rem; }

        .open-btn {
            display: block;
            width: 100%;
            margin-bottom: 1rem;
            border-color: var(--border);
            color: var(--muted);
        }

        /* Floating button, bottom right */
        .fab {
            position: fixed;
            right: max(1.25rem, env(safe-area-inset-right));
            bottom: max(1.25rem, env(safe-area-inset-bottom));
            width: 3.5rem;
            height: 3.5rem;
            padding: 0;
            border-radius: 50%;
            background: var(--fg);
            color: var(--bg);
            border: none;
            font-size: 1.75rem;
            line-height: 3.5rem;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
            z-index: 10;
            transition: transform 0.2s ease;
        }
        .fab:hover { background: var(--fg); color: var(--bg); }
        .fab.hidden-fab { transform: scale(0); }

        /* Bottom sheet */
        .backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.35);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
            z-index: 20;
        }
        .backdrop.open { opacity: 1; pointer-events: auto; }

        .sheet {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            max-width: 32rem;
            margin: 0 auto;
            max-height: 92vh;
            overflow-y: auto;
            background: var(--bg);
            border: 1px solid var(--border);
            border-bottom: none;
            border-radius: 14px 14px 0 0;
            padding: 0 1rem max(1rem, env(safe-area-inset-bottom));
            transform: translateY(105%);
            transition: transform 0.28s cubic-bezier(0.2, 0.8, 0.2, 1);
            z-index: 30;
            touch-action: pan-y;
        }
        .sheet.open { transform: translateY(0); }
        .sheet.dragging { transition: none; }

        .sheet-grip {
            display: flex;
            justify-content: center;
            padding: 0.6rem 0 0.4rem;
            cursor: grab;
            touch-action: none;
        }
        .sheet-grip span {
            width: 2.5rem;
            height: 4px;
            border-radius: 2px;
            background: var(--border);
        }

        .sheet-head {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.75rem;
            min-height: 2rem;
        }
        .sheet-head h2 {
            font-size: 1rem;
            font-weight: normal;
            flex: 1;
        }
        .sheet-head .icon-btn {
            border: none;
            padding: 0.25rem 0.5rem;
            background: none;
            color: var(--fg);
        }
        .sheet-head .icon-btn:hover { background: none; color: var(--fg); opacity: 0.6; }

        /* The two ways to add someone */
        .choice {
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
            width: 100%;
            text-align: left;
            padding: 0.9rem 1rem;
            margin-bottom: 0.6rem;
            border-color: var(--border);
        }
        .choice:hover { background: var(--bg); color: var(--fg); border-color: var(--fg); }
        .choice .glyph { font-size: 1.25rem; line-height: 1.5rem; width: 1.5rem; text-align: center; }
        .choice strong { display: block; font-weight: normal; }
        .choice small { display: block; color: var(--muted); font-size: 0.8125rem; line-height: 1.35; margin-top: 0.15rem; }

        /* My code / Scan theirs */
        .segmented {
            display: flex;
            border: 1px solid var(--fg);
            border-radius: var(--radius);
            overflow: hidden;
            margin-bottom: 1rem;
        }
        .segmented button {
            flex: 1;
            border: none;
            border-radius: 0;
            padding: 0.45rem 0.5rem;
            font-size: 0.9375rem;
        }
        .segmented button + button { border-left: 1px solid var(--fg); }
        .segmented button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }

        /* Same size in both tabs, so the sheet doesn't jump */
        .stage {
            --side: min(74vw, 280px);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .stage-box {
            width: var(--side);
            height: var(--side);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .stage-box .stamp { width: 100%; height: auto; }
        .stage .fingerprint { width: var(--side); margin-top: 0.75rem; }
        .stage .hint {
            width: var(--side);
            margin-top: 0.75rem;
            padding: 0.5rem;
            text-align: center;
            font-size: 0.875rem;
            color: var(--muted);
            border: 1px dashed var(--border);
            border-radius: var(--radius);
        }

        .cam {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 10px;
            overflow: hidden;
            background: #000;
        }
        .cam video { width: 100%; height: 100%; object-fit: cover; display: block; }
        .cam::after {
            content: '';
            position: absolute;
            inset: 14%;
            border: 2px solid rgba(255, 255, 255, 0.8);
            border-radius: 8px;
            pointer-events: none;
        }
        .cam .cam-msg {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            color: #ddd;
            font-size: 0.875rem;
            text-align: center;
        }

        .sheet .status { margin: 0 0 1rem; }

        .proto-bar {
            margin-top: 2rem;
            font-size: 0.75rem;
            color: var(--muted);
            text-align: center;
        }
        .proto-bar a { color: var(--muted); }

        @media (prefers-reduced-motion: reduce) {
            .sheet, .backdrop, .fab { transition: none; }
        }
    </style>
</head>
<body>
    <div class="container" id="home"></div>

    <div class="backdrop" id="backdrop"></div>
    <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="add a contact">
        <div class="sheet-grip" id="grip"><span></span></div>
        <div id="sheet-body"></div>
    </section>
    <button class="fab" id="fab" aria-label="Add a contact">+</button>

    <script type="module">
        // Prototype of "add a contact": a + button opens a bottom sheet with
        // two choices; "meet in person" shows your code or the camera, one at
        // a time, inside the sheet. Reads your real identity and contacts on
        // this phone, but never saves anything.
        import * as stamp from '../js/utils/stamp.js';
        import * as qr from '../js/utils/qr.js';
        import * as crypto from '../js/utils/crypto.js';
        import * as identity from '../js/services/identity.js';
        import * as contacts from '../js/services/contacts.js';

        const theme = localStorage.getItem('pigeon_theme') || 'light';
        document.documentElement.setAttribute('data-theme', theme);
        document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#111111' : '#ffffff';

        const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

        // Real identity if this phone has one, otherwise a demo one
        const me = identity.get() || (() => {
            const kp = nacl.box.keyPair();
            return { publicKey: crypto.encodeBase64(kp.publicKey), name: 'you', avatar: null };
        })();
        const myFp = crypto.fingerprint(me.publicKey);
        const appUrl = new URL('../', location.href);
        const myLink = `${appUrl.origin}${appUrl.pathname}#meet=1.${me.publicKey.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '')}.${encodeURIComponent((me.name || '').slice(0, 40))}`;

        const SAMPLE = [
            { name: 'eva', publicKey: 'c2FtcGxlLWV2YS1rZXktMDAwMDAwMDAwMDAwMDAwMDA=', fingerprint: 'willow-ember-harbor', lastExchange: { dir: 'in', at: Date.now() - 3600e3 } },
            { name: 'romain', publicKey: 'c2FtcGxlLXJvbWFpbi1rZXktMDAwMDAwMDAwMDAwMDA=', fingerprint: 'frost-summit-grove', lastExchange: { dir: 'out', at: Date.now() - 86400e3 * 3 } }
        ];
        const params = new URLSearchParams(location.search);
        const empty = params.has('empty');
        const list = empty ? [] : (identity.get() ? contacts.getAll() : SAMPLE);

        // ---------- Home ----------
        function renderHome() {
            const items = list.map(c => `
                <li class="contact-item">
                    ${stamp.render(48, c.avatar || '', { marked: c.lastExchange?.dir === 'in', rotation: stamp.tiltFor(c.publicKey) })}
                    <div class="contact-info">
                        <span class="name">${esc(c.name)}</span>
                        ${c.lastExchange ? `<span class="last-exchange">${c.lastExchange.dir === 'in' ? '↓ received' : '↑ sent'}</span>` : ''}
                    </div>
                    <span class="fp">${esc(c.fingerprint)}</span>
                </li>`).join('');

            const emptyState = `
                <p class="text-muted text-small mb-1">No contacts yet. Add your first one:</p>
                ${choicesHtml()}`;

            document.getElementById('home').innerHTML = `
                <header>
                    <h1>pigeon</h1>
                    <button class="theme-toggle" id="theme">${theme === 'dark' ? '○' : '●'}</button>
                </header>
                <div class="card">
                    <div class="identity-row">
                        ${stamp.render(64, me.avatar || '', { rotation: stamp.tiltFor(me.publicKey) })}
                        <div class="identity-info">
                            <p class="text-muted text-small">${esc(me.name) || 'unnamed'}</p>
                            <div class="fingerprint">${myFp}</div>
                        </div>
                        <button class="btn btn-ghost">⚙</button>
                    </div>
                </div>
                <button class="btn open-btn" id="open-btn">↓ open a pigeon image</button>
                <div class="card">
                    <h2>contacts</h2>
                    ${list.length ? `<ul class="contact-list">${items}</ul>` : emptyState}
                </div>
                <p class="proto-bar">prototype · nothing is saved ·
                    ${empty ? '<a href="?">show contacts</a>' : '<a href="?empty">show empty list</a>'}
                    · <a href="../">back to the app</a></p>`;

            document.getElementById('theme').onclick = () => {
                localStorage.setItem('pigeon_theme', theme === 'dark' ? 'light' : 'dark');
                location.reload();
            };
            document.getElementById('open-btn').onclick = () => toast('Opens the file picker, as today.');
            bindChoices(document.getElementById('home'));
        }

        function choicesHtml() {
            return `
                <button class="btn choice" data-go="meet">
                    <span class="glyph">▦</span>
                    <span><strong>Meet in person</strong><small>You're together. Scan each other's codes.</small></span>
                </button>
                <button class="btn choice" data-go="invite">
                    <span class="glyph">✉</span>
                    <span><strong>Send an invite</strong><small>They're far away. Send them a bird image.</small></span>
                </button>`;
        }

        function bindChoices(root) {
            root.querySelectorAll('[data-go="meet"]').forEach(b => b.onclick = () => openSheet('meet'));
            root.querySelectorAll('[data-go="invite"]').forEach(b => b.onclick = () => {
                closeSheet();
                toast('Goes to the invite screen, as today.');
            });
        }

        // ---------- Sheet ----------
        const sheet = document.getElementById('sheet');
        const backdrop = document.getElementById('backdrop');
        const fab = document.getElementById('fab');
        const body = document.getElementById('sheet-body');

        const view = { step: 'choose', tab: 'mine', met: null, note: '' };
        let stopCam = null;

        function openSheet(step = 'choose') {
            Object.assign(view, { step, tab: 'mine', met: null, note: '' });
            renderSheet();
            sheet.classList.add('open');
            backdrop.classList.add('open');
            fab.classList.add('hidden-fab');
        }

        function closeSheet() {
            camOff();
            sheet.classList.remove('open');
            backdrop.classList.remove('open');
            fab.classList.remove('hidden-fab');
            sheet.style.transform = '';
        }

        function camOff() {
            if (stopCam) { stopCam(); stopCam = null; }
        }

        function renderSheet() {
            camOff();
            if (view.step === 'choose') {
                body.innerHTML = `
                    <div class="sheet-head"><h2>add a contact</h2>
                        <button class="icon-btn" data-close aria-label="Close">✕</button></div>
                    ${choicesHtml()}`;
                bindChoices(body);
            } else if (view.step === 'meet') {
                body.innerHTML = `
                    <div class="sheet-head">
                        <button class="icon-btn" data-back aria-label="Back">←</button>
                        <h2>meet in person</h2>
                        <button class="icon-btn" data-close aria-label="Close">✕</button>
                    </div>
                    ${view.note}
                    <div class="segmented" role="tablist">
                        <button data-tab="mine" aria-pressed="${view.tab === 'mine'}">My code</button>
                        <button data-tab="scan" aria-pressed="${view.tab === 'scan'}">Scan theirs</button>
                    </div>
                    <div class="stage">
                        ${view.tab === 'mine' ? `
                            <div class="stage-box">${stamp.render(200, qr.qrDataUrl(myLink), { contain: true })}</div>
                            <div class="fingerprint">${myFp}</div>
                        ` : `
                            <div class="stage-box"><div class="cam">
                                <video id="cam-video" playsinline muted></video>
                                <div class="cam-msg" id="cam-msg">starting the camera…</div>
                            </div></div>
                            <div class="hint" id="cam-hint">Point at the code on their phone.</div>
                        `}
                    </div>`;
                body.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => {
                    view.tab = b.dataset.tab;
                    view.note = '';
                    renderSheet();
                });
                if (view.tab === 'scan') camOn();
            } else if (view.step === 'confirm') {
                const m = view.met;
                body.innerHTML = `
                    <div class="sheet-head">
                        <button class="icon-btn" data-back aria-label="Back">←</button>
                        <h2>meet in person</h2>
                        <button class="icon-btn" data-close aria-label="Close">✕</button>
                    </div>
                    <div class="arrival-stamp landing">${stamp.render(96, '', { rotation: stamp.tiltFor(m.publicKey) })}</div>
                    <p class="mb-1">${esc(m.name) || 'unnamed'}</p>
                    <div class="fingerprint">${crypto.fingerprint(m.publicKey)}</div>
                    <p class="text-muted text-small mt-1 mb-1">Their screen should show the same three words.</p>
                    <div class="field">
                        <label>save contact as</label>
                        <input type="text" id="meet-name" value="${esc(m.name)}" placeholder="Bob">
                    </div>
                    <button class="btn btn-block mb-1" id="add-btn">Add contact</button>`;
                document.getElementById('add-btn').onclick = () => {
                    const name = document.getElementById('meet-name').value.trim() || m.name || 'them';
                    Object.assign(view, {
                        step: 'meet', tab: 'mine', met: null,
                        note: `<div class="status info"><strong>${esc(name)}</strong> would be added (prototype: not saved). If they haven't scanned you yet, let them scan this now.</div>`
                    });
                    renderSheet();
                };
            }

            body.querySelectorAll('[data-close]').forEach(b => b.onclick = closeSheet);
            body.querySelectorAll('[data-back]').forEach(b => b.onclick = () => {
                Object.assign(view, view.step === 'confirm'
                    ? { step: 'meet', tab: 'scan', note: '' }
                    : { step: 'choose', note: '' });
                renderSheet();
            });
        }

        async function camOn() {
            const video = document.getElementById('cam-video');
            const msg = document.getElementById('cam-msg');
            const hint = document.getElementById('cam-hint');
            try {
                const stop = await qr.startScanner(video, (text) => {
                    const met = qr.parseMeetLink(text);
                    if (!met) { hint.textContent = "That's not a Pigeon code."; return false; }
                    if (met.publicKey === me.publicKey) { hint.textContent = "That's your own code."; return false; }
                    stopCam = null;
                    if (navigator.vibrate) navigator.vibrate(30);
                    Object.assign(view, { step: 'confirm', met });
                    renderSheet();
                    return true;
                });
                if (!video.isConnected) { stop(); return; } // tab changed meanwhile
                stopCam = stop;
                msg.remove();
            } catch (err) {
                msg.textContent = {
                    NotAllowedError: 'Camera access was refused.',
                    NotFoundError: 'No camera on this device.',
                    NotReadableError: 'The camera is busy in another app.',
                    NotSupportedError: "This browser can't use the camera here."
                }[err.name] || "The camera didn't start.";
            }
        }

        backdrop.onclick = closeSheet;
        fab.onclick = () => openSheet('choose');
        document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

        // Drag the grip down to close
        (() => {
            const grip = document.getElementById('grip');
            let y0 = null, dy = 0;
            grip.addEventListener('pointerdown', e => {
                y0 = e.clientY; dy = 0;
                sheet.classList.add('dragging');
                grip.setPointerCapture(e.pointerId);
            });
            grip.addEventListener('pointermove', e => {
                if (y0 === null) return;
                dy = Math.max(0, e.clientY - y0);
                sheet.style.transform = `translateY(${dy}px)`;
            });
            const end = () => {
                if (y0 === null) return;
                y0 = null;
                sheet.classList.remove('dragging');
                sheet.style.transform = '';
                if (dy > 90) closeSheet();
            };
            grip.addEventListener('pointerup', end);
            grip.addEventListener('pointercancel', end);
        })();

        // Small transient message
        function toast(text) {
            const t = document.createElement('div');
            t.className = 'status info';
            t.style.cssText = 'position:fixed;left:1rem;right:1rem;bottom:5.5rem;margin:0 auto;max-width:30rem;background:var(--bg);z-index:40;';
            t.textContent = text;
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 2200);
        }

        renderHome();
    </script>
</body>
</html>
