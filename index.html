<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Pigeon</title>
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/vendor/nacl-fast.min.js"></script>
</head>
<body>
    <div class="container">
        <div id="app">
            <p>Loading...</p>
        </div>
    </div>
    <button class="fab hidden" id="fab" aria-label="Add a contact" onclick="window.app.openAddSheet()">+</button>
    <div class="backdrop" id="backdrop"></div>
    <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="add a contact">
        <div class="sheet-grip" id="grip"><span></span></div>
        <div id="sheet-body"></div>
    </section>
    <script type="module" src="js/app.js"></script>
</body>
</html>
